name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # smoke is skipped here: it requires a running `npm start` server
      # (scripts/smoke.mjs hits http://localhost:3420 directly), which a plain
      # build-and-test CI job doesn't provide. Run it locally before releases instead.
